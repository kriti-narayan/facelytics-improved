<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facial Recognition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="glass-card">
      <h1>🧠 Facial Recognition</h1>
      <p class="subheading">AI-powered recognition using Python & Eel</p>

      <div class="video-container">
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="snapshot" style="display: none;"></canvas>
      </div>

      <div class="button-group">
        <button class="btn start" onclick="startRecognition()">Start</button>
        <button class="btn stop" onclick="stopRecognition()">Stop</button>
      </div>

      <p id="status" class="status-text">Status: Waiting to start</p>
    </div>
  </div>

  <script type="text/javascript" src="/eel.js"></script>
  <script src="script.js"></script>
</body>
</html>
